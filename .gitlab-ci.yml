stages: [lint, publish]

variables:
  SCL_SRC_DIR: src

clang-tidy:
  stage: lint
  image: silkeh/clang:21
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
  script:
    - bash script/lint/clang_tidy.sh

clang-format:
  stage: lint
  image: silkeh/clang:21
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
  script:
    - bash script/lint/clang_format.sh

doxygen:
  stage: lint
  image: archlinux:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
  before_script:
    - pacman -Sy --noconfirm doxygen
    - doxygen --version
  script:
    - bash script/lint/doxygen.sh

cppcheck:
  stage: lint
  image: ubuntu:24.04
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
  before_script:
    - apt-get update && apt-get install -y cppcheck
    - cppcheck --version
  script:
    - bash script/lint/cppcheck.sh

# ---------------------
# Documentation
# ---------------------
pages:
  stage: publish
  image: archlinux:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  variables:
    GIT_DEPTH: 0
  before_script:
    - pacman -Sy --noconfirm doxygen graphviz python git ca-certificates
    - git fetch --prune --tags
  script:
    - sh script/ci/deploy_versioned_docs.sh public
  artifacts:
    paths:
      - public

# ---------------------
# Mirror to GitHub
# ---------------------
mirror:github:
  stage: publish
  image:
      name: alpine/git
      entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    # Set in GitLab CI/CD group variables (ssoft-scl):
    #   GITHUB_TOKEN       - GitHub PAT with Contents: Write (masked)
    # Set in GitLab CI/CD project variables:
    #   GITHUB_MIRROR_URL  - https://github.com/ssoft-hub/scl-utility.git
  script:
    - sh script/ci/mirror_github.sh
