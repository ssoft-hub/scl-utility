# A pipeline runs for a merge request, for dev, and for a version tag. A plain branch
# push starts nothing, and the checks answer for what a merge request proposes: the same
# commits reach dev through one, and GitHub lints dev and main for nothing on top.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/

stages: [lint, publish]

variables:
  SCL_SRC_DIR: src

# The policy of the workflow block above, as the lint stage states it: a check answers for
# what a merge request proposes. A job extends this instead of repeating the condition, so
# the stage cannot come to hold two policies.
.lint_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

clang:
  stage: lint
  # 22 for both tools: 21 reads `is_same_v<X &&, ...>` as a comparison and spaces it out.
  image: silkeh/clang:22
  extends: .lint_rules
  script:
    - status=0
    - bash script/lint/clang_tidy.sh || status=1
    - bash script/lint/clang_format.sh || status=1
    - exit $status

doxygen:
  stage: lint
  image: archlinux:latest
  extends: .lint_rules
  before_script:
    - pacman -Sy --noconfirm doxygen
    - doxygen --version
  script:
    - status=0
    - bash script/lint/doxygen.sh || status=1
    - bash script/lint/doc_snippets.sh || status=1
    - exit $status

cppcheck:
  stage: lint
  image: ubuntu:24.04
  extends: .lint_rules
  before_script:
    - apt-get update && apt-get install -y cppcheck
    - cppcheck --version
  script:
    - bash script/lint/cppcheck.sh

# ---------------------
# Documentation
# ---------------------
pages:
  stage: publish
  image: archlinux:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  variables:
    GIT_DEPTH: 0
  before_script:
    - pacman -Sy --noconfirm doxygen graphviz python git ca-certificates
    - git fetch --prune --tags
  script:
    - sh script/ci/deploy_versioned_docs.sh public
  artifacts:
    paths:
      - public
