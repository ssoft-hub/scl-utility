name: Lint

on:
  push:
    branches: [main, dev]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    container: silkeh/clang:22
    steps:
      - uses: actions/checkout@v7

      - name: Run clang-tidy
        run: bash script/lint/clang_tidy.sh

  clang-format:
    runs-on: ubuntu-latest
    # 22 for both clang jobs: 21 reads `is_same_v<X &&, ...>` as a comparison and
    # spaces it out.
    container: silkeh/clang:22
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: bash script/lint/clang_format.sh

  doxygen:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm git ca-certificates

      - uses: actions/checkout@v7

      - name: Install doxygen
        run: |
          pacman -S --noconfirm doxygen
          doxygen --version

      - name: Run doxygen lint
        run: bash script/lint/doxygen.sh

  doc-snippets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check documentation snippets
        run: bash script/lint/doc_snippets.sh

  cppcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install cppcheck
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          cppcheck --version

      - name: Run cppcheck
        run: bash script/lint/cppcheck.sh
