name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['*']

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    container: silkeh/clang:21
    steps:
      - uses: actions/checkout@v6

      - name: Run clang-tidy
        run: bash script/lint/clang_tidy.sh

  clang-format:
    runs-on: ubuntu-latest
    container: silkeh/clang:21
    steps:
      - uses: actions/checkout@v6

      - name: Check formatting
        run: bash script/lint/clang_format.sh

  cppcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install cppcheck
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          cppcheck --version

      - name: Run cppcheck
        run: bash script/lint/cppcheck.sh
