name: Lint

on:
  push:
    branches: [main, dev]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    container: silkeh/clang:22
    steps:
      - uses: actions/checkout@v7

      - name: Run clang-tidy
        run: bash script/lint/clang_tidy.sh

  clang-format:
    runs-on: ubuntu-latest
    # Not 21: it reads `is_same_v<X &&, ...>` as a comparison and spaces it out.
    container: silkeh/clang:22
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: bash script/lint/clang_format.sh

  doxygen:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/ssoft-docker/ci-images/doxygen:1.18.0-2@sha256:156901db0bf2d3c4c690c1f1f17341d1969f7d6dd08e3c0f4b23d65eec2ee839
    steps:
      - uses: actions/checkout@v7

      - name: Print the pinned doxygen version
        run: doxygen --version

      - name: Run doxygen lint
        run: bash script/lint/doxygen.sh

  doc-snippets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check documentation snippets
        run: bash script/lint/doc_snippets.sh

  cppcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install cppcheck
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          cppcheck --version

      - name: Run cppcheck
        run: bash script/lint/cppcheck.sh
