name: Documentation

on:
  push:
    branches: [dev]
    tags: ['v[0-9]*']

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/ssoft-docker/ci-images/doxygen:1.18.0-2@sha256:156901db0bf2d3c4c690c1f1f17341d1969f7d6dd08e3c0f4b23d65eec2ee839
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: git config --global --add safe.directory '*'

      - name: Fetch tags
        run: git fetch --prune --tags

      - name: Print the pinned doxygen version
        run: doxygen --version

      - name: Build versioned docs
        run: sh script/ci/deploy_versioned_docs.sh public

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
